{% comment %}
  ns-topbar.html | Sticky topbar with primary nav.
  Per redesign: Home / Crew / Skills / Logs / Docs.
  Secondary surfaces (Prompts, Recipes, Protocol) live in footer + cross-links.
{% endcomment %}
<header class="topbar">
  <div class="topbar-inner">
    <a href="{{ '/' | relative_url }}" class="brand">
      <img src="{{ '/assets/images/brand/NukaSoft_Log.png' | relative_url }}" alt="NukaSoft">
      <span class="brand-text">NukaSoft.AI</span>
    </a>
    <nav>
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a>
      <a href="{{ '/crew/' | relative_url }}"{% if page.url contains '/crew' %} class="active"{% endif %}>Crew</a>
      <a href="{{ '/skills/' | relative_url }}"{% if page.url contains '/skills' %} class="active"{% endif %}>Skills</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} class="active"{% endif %}>Logs</a>
      <a href="{{ '/docs/' | relative_url }}"{% if page.url contains '/docs' %} class="active"{% endif %}>Docs</a>
      <a href="https://github.com/NukaSoft/nukasoft.ai" class="gh"><span class="star">★</span> GitHub</a>
    </nav>
  </div>
</header>
